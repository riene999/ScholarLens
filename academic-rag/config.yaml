llm:
  provider: "deepseek"
  api_key: null 
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  temperature: 0.3
  max_tokens: 2048
  citation_check:
    enabled: true
    retries: 1
    model: "deepseek-chat"

embedding:
  model: "BAAI/bge-small-en-v1.5"
  device: "cuda"
  batch_size: 64
  query_cache:
    enabled: true
    max_size: 10000
    ttl_seconds: 1800

retrieval:
  top_k: 5
  score_threshold: 0.5
  query_decomposition:
    enabled: true
    max_subquestions: 3
  result_cache:
    enabled: true
    max_size: 5000
    ttl_seconds: 900

pdf_parser:
  engine: "marker"  # pypdf2 | marker
  engines:
    pypdf2:
      chunk_size: 3400
      chunk_overlap: 425
    marker:
      chunk_size: 4096
      chunk_overlap: 512
      summarize_tables: true
      summarize_formulas: false

vector_store:
  index_root: "./data/faiss_indexes"
  dimension: 384

reranker:
  enabled: false
  model: "BAAI/bge-reranker-base"
  device: "cpu"
  batch_size: 16
  candidate_top_k: 20

bm25:
  enabled: true
  top_k: 20
  k1: 1.5
  b: 0.75
  rrf_k: 60

storage:
  local_db_path: "./data/app.sqlite"

# Agentic context memory. Raw history and evidence stay in SQLite; only the
# active prompt is compacted when it approaches the model context limit.
memory:
  soft_threshold_tokens: 75000
  hard_threshold_tokens: 100000
  hard_compact_batch_tokens: 50000
  preserve_recent_rounds: 3
  summary_max_tokens: 6000
  max_single_tool_result_tokens: 10000
  max_rag_evidence_tokens: 16000
  artifact_digest_tokens: 200
  token_estimate_safety_factor: 1.1

server:
  host: "0.0.0.0"
  port: 8000
  reload: true
